[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "r2py"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "tree-sitter",
    "tree-sitter-language-pack",
]

[project.optional-dependencies]
rpy2   = ["rpy2"]
models = ["lightgbm"]

[project.scripts]
r2py = "r2py.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["r2py*"]
